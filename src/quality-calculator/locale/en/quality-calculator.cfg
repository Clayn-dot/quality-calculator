[mod-name]
quality-calculator=Quality Calculator

[mod-description]
quality-calculator=How much legendary will your factory give you? Drag a box over your machines and see it per second, minute, 10 minutes or hour. Type in how much you really feed in, and the numbers follow.

[item-name]
qcalc-selection-tool=Quality Calculator

[shortcut-name]
qcalc-shortcut=Quality Calculator

[controls]
qcalc-give-tool=Quality Calculator: take the area selection tool

[mod-setting-name]
qcalc-skip-blocked=Quality Calculator: skip machines with a full output
qcalc-recycler-mode=Quality Calculator: which quality a recycler takes
qcalc-keep-from=Quality Calculator: do not recycle starting from
qcalc-limit-by-supply=Quality Calculator: limit machines by what the area supplies

[mod-setting-description]
qcalc-skip-blocked=A mining drill with the status "Target full" produces nothing, so it is left out. Other machines with a full output are not skipped: the maximum is calculated. The status is remembered when you select; select the machines again to recalculate after clearing the output.
qcalc-recycler-mode=By recycler quality: each recycler takes the quality it worked on last (how sorted lines are built). Any: all recyclers take any quality below the threshold from the next setting.
qcalc-keep-from=Only used in the "Any quality" mode. Recyclers take items below this quality. By default everything except the highest unlocked quality.
qcalc-limit-by-supply=On: when the area makes an item itself, its consumers get no more than what is produced (they idle the rest of the time); raw items nobody in the area makes (including items the area only gets back from recyclers) are treated as arriving from outside without limit. Off: every machine runs at 100% and the shortfall shows up in the input.

[string-mod-setting]
qcalc-recycler-mode-by-quality=By recycler quality
qcalc-recycler-mode-any=Any quality below the threshold
qcalc-keep-from-highest=Highest unlocked quality
qcalc-keep-from-epic=Epic and above
qcalc-keep-from-rare=Rare and above
qcalc-keep-from-uncommon=Uncommon and above

