[mod-name]
quality-calculator=Quality Calculator

[mod-description]
quality-calculator=Насколько качественная у тебя фабрика? Обведи машины рамкой и смотри, что она выдаёт за любой отрезок времени. Впиши, сколько реально подаёшь на вход, и цифры пересчитаются.

[item-name]
qcalc-selection-tool=Калькулятор качества

[shortcut-name]
qcalc-shortcut=Калькулятор качества

[controls]
qcalc-give-tool=Калькулятор качества: взять инструмент выбора области

[mod-setting-name]
qcalc-skip-blocked=Калькулятор качества: не считать машины с заполненным выходом
qcalc-recycler-mode=Калькулятор качества: какое качество берёт переработчик
qcalc-keep-from=Калькулятор качества: не перерабатывать, начиная с
qcalc-limit-by-supply=Калькулятор качества: машины ограничены притоком из области

[mod-setting-description]
qcalc-skip-blocked=Бур со статусом «Цель заполнена» (Target full) ничего не выдаёт, поэтому не входит в расчёт. У остальных машин заполненный выход не учитывается: считается максимум. Статус запоминается в момент выбора; чтобы пересчитать после расчистки, выдели машины заново.
qcalc-recycler-mode=По качеству переработчика: каждый переработчик берёт то качество, на котором он работал в последний раз (так устроены линии с сортировкой). Любое: все переработчики берут любое качество ниже порога из соседней настройки.
qcalc-keep-from=Работает только в режиме «Любое качество». Переработчики берут предметы ниже этого качества. По умолчанию все, кроме высшего открытого.
qcalc-limit-by-supply=Включено: если предмет делает сама область, потребители получают не больше, чем выпущено (остальное время они простаивают), а сырьё без источника в области (в том числе то, что область лишь возвращает переработчиками) считается поступающим снаружи без ограничений. Выключено: все машины работают на 100%, а нехватка показывается во входе.

[string-mod-setting]
qcalc-recycler-mode-by-quality=По качеству переработчика
qcalc-recycler-mode-any=Любое качество ниже порога
qcalc-keep-from-highest=Высшее открытое качество
qcalc-keep-from-epic=Эпическое и выше
qcalc-keep-from-rare=Редкое и выше
qcalc-keep-from-uncommon=Необычное и выше

